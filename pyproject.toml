[project]
name = "github-flow-analytics"
version = "0.1.0"
description = "Public GitHub flow analytics hosted on Cloudflare Workers"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]

[project.optional-dependencies]
local = [
  "google-generativeai>=0.5.0",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "unit: pure-logic tests, no I/O",
    "integration: multiple components with the outermost boundary (gh, Gemini) faked",
    "e2e: whole pipeline from raw GitHub payloads to API and dashboard output",
]

[tool.coverage.run]
source = ["analyze", "app", "issues", "product_value", "repo_research", "value_classification"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 200

[tool.ruff.lint]
# Errors only: syntax errors and undefined names. The legacy code was never linted.
select = ["E9", "F63", "F7", "F82"]
